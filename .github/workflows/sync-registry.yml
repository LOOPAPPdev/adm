name: Sync registry
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      source:
        description: "IDs de fontes separados por vírgula (vazio = todas)"
        required: false
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: npm test
      - name: Sync (somente leitura das fontes; nenhum código de terceiros é executado)
        run: node apps/orchestrator/src/cli.mjs sync ${{ inputs.source && format('--source {0}', inputs.source) || '' }}
      - run: npm run build
      - name: Commit se o índice mudou
        run: |
          git config user.name "adm-registry-bot"
          git config user.email "adm-registry-bot@users.noreply.github.com"
          git add storage/indexes storage/reports apps/web/src/data
          git diff --cached --quiet || (git commit -m "chore(registry): sync $(date -u +%F)" && git push)
