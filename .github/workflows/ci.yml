name: CI
on:
  push:
  pull_request:
jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: npm test
      - run: npm run build
  loop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: npm run loop:test
      - run: npm run loop:build
      - run: npx playwright install --with-deps chromium
        working-directory: apps/loop
      - run: npm run loop:e2e -- --trace off
