name: CI
on:
  push:
  pull_request:
jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm test # orchestrator + apps/web (domain, API, data layer)
      - run: npm run typecheck
      - run: npm run build
      - run: npm run cf-build # OpenNext must produce apps/web/.open-next/worker.js
      - run: test -f apps/web/.open-next/worker.js
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - name: Local D1 for the Worker E2E (wrangler dev)
        working-directory: apps/web
        run: |
          printf 'BOOTSTRAP_TOKEN=local-e2e-token-only\n' > .dev.vars
          npx wrangler d1 migrations apply loop-db --local
      - run: npm run e2e # website, Workspace, Studio, Portal (next start) + connected mode on the Worker (wrangler dev)
