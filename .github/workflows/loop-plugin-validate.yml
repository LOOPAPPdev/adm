name: LOOP Plugin Validation
on:
  pull_request:
    paths:
      - 'plugins/loop-engineering-partner/**'
      - '.github/workflows/loop-plugin-validate.yml'
  push:
    paths:
      - 'plugins/loop-engineering-partner/**'
      - '.github/workflows/loop-plugin-validate.yml'
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node plugins/loop-engineering-partner/scripts/validate.mjs
      - run: node --test plugins/loop-engineering-partner/test/*.test.mjs

      - name: Package installable plugin
        run: |
          cd plugins/loop-engineering-partner
          zip -q -r "$RUNNER_TEMP/loop-engineering-partner.plugin" . -x '*.DS_Store'
          test -s "$RUNNER_TEMP/loop-engineering-partner.plugin"
      - uses: actions/upload-artifact@v4
        with:
          name: loop-engineering-partner-package
          path: ${{ runner.temp }}/loop-engineering-partner.plugin
          if-no-files-found: error
